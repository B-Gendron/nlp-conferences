<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venue Radar · NLP &amp; Semantic Web deadlines</title>
  <meta name="description" content="Plan your publication strategy across NLP/LLM and Semantic Web/Knowledge Engineering venues: deadlines, decision dates and conference schedules.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235b47e0'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <h1>Venue Radar</h1>
        <p>Deadlines &amp; decisions for NLP/LLM and Semantic Web/KE venues</p>
      </div>
      <div class="top-actions">
        <button id="changes-btn" class="link">What changed</button>
        <a class="link" href="calendar.ics" title="Subscribe in your calendar app">Calendar feed</a>
        <button id="tz" class="link" title="Toggle between your local time and Anywhere-on-Earth (UTC-12)">Times: local</button>
        <button id="theme" class="link" title="Cycle light / dark / auto">Theme</button>
      </div>
    </div>
    <div class="wrap">
      <div class="search-row">
        <input id="q" type="search" placeholder="Search venues, e.g. ACL, ISWC, Budapest…  ( / )" aria-label="Search venues" autocomplete="off">
        <nav id="tabs" role="tablist" aria-label="Views"></nav>
      </div>
      <div id="controls" class="controls"></div>
      <div class="sub-row">
        <div id="tl-opts" class="tl-opts"></div>
        <div class="status"><span id="count"></span> · <span id="updated"></span></div>
      </div>
    </div>
  </header>

  <main class="wrap"><div id="view" aria-live="polite"><p class="muted">Loading…</p></div></main>

  <footer class="wrap foot">
    Data from <a href="https://github.com/ccfddl/ccf-deadlines">ccfddl/ccf-deadlines</a> (MIT) plus hand-curated entries.
    Always double-check dates on the official call for papers.
  </footer>

  <div id="tip" class="tip" hidden></div>
  <dialog id="detail"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
