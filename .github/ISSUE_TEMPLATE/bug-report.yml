name: Bug report
description: Something in the app doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: "e.g. Firefox 130 on macOS"
