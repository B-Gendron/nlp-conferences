name: Sync deadlines & deploy

on:
  schedule:
    # Weekly, Tuesdays 14:00 Paris time. Cron is UTC-only, so fire at both possible UTC hours
    # (summer = 12:00, winter = 13:00) and let the `gate` job keep whichever one is 14:00 in Paris.
    - cron: '0 12 * * 2'
    - cron: '0 13 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Paris date +%H)" != "14" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pull latest upstream deadlines
        run: npm run sync
      - name: Commit refreshed data
        run: |
          git config user.name "deadline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data site/calendar.ics
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "chore(data): sync deadlines $(date -u +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
