# Registry of the venues this tool tracks.  >>> This is the file you edit. <<<
#
# Each venue is either
#   * synced   : has `upstream:` (a path in github.com/ccfddl/ccf-deadlines, conference/<path>.yml).
#                Dates, places and CORE/CCF ranks are refreshed automatically by `npm run sync`.
#   * manual   : has no `upstream:`; you list editions yourself under `editions:` (see the bottom of the file).
#
# Fields
#   id           unique slug
#   domains      any of: nlp | kg (semantic web, knowledge engineering, KR) | ml | ir
#   neurosym     true if the venue is a natural home for neurosymbolic work
#   review_days  typical days between submission deadline and notification. Used ONLY to show an
#                *estimated* notification date (dashed in the UI) when the real one isn't known yet.
#                Initial values come from the 2024 edition of the original spreadsheet. Only set it for
#                venues with a single direct-submission track: ARR-based venues (*ACL) have no meaningful value.
#   core         CORE rank fallback for manual venues (synced venues get it from upstream)
#
# Real notification dates go in data/overrides.yml and always win over estimates.

# ------------------------------------------------------------------ NLP & LLMs
- { id: acl,    upstream: AI/acl,    domains: [nlp] }
- { id: emnlp,  upstream: AI/emnlp,  domains: [nlp] }
- { id: naacl,  upstream: AI/naacl,  domains: [nlp] }
- { id: eacl,   upstream: AI/eacl,   domains: [nlp] }
- { id: coling, upstream: AI/coling, domains: [nlp] }
- { id: conll,  upstream: AI/conll,  domains: [nlp] }
- { id: ijcnlp, upstream: AI/ijcnlp, domains: [nlp] }
- { id: colm,   upstream: AI/colm,   domains: [nlp, ml] }
- { id: nlpcc,  upstream: AI/nlpcc,  domains: [nlp] }

# ------------------------------------------------------------------ ML & general AI
- { id: nips,   upstream: AI/nips,   domains: [ml], neurosym: true }
- { id: iclr,   upstream: AI/iclr,   domains: [ml], neurosym: true, review_days: 109 }
- { id: icml,   upstream: AI/icml,   domains: [ml] }
- { id: aaai,   upstream: AI/aaai,   domains: [ml, kg], neurosym: true, review_days: 116 }
- { id: ijcai,  upstream: AI/ijcai,  domains: [ml, kg], neurosym: true }
- { id: ecai,   upstream: AI/ecai,   domains: [ml, kg], neurosym: true }
- { id: ijcnn,  upstream: AI/ijcnn,  domains: [ml], review_days: 60 }
- { id: pkdd,   upstream: DB/pkdd,   domains: [ml] }

# ------------------------------------------------------------------ Semantic Web, KE & reasoning
- { id: iswc,     upstream: DB/iswc,     domains: [kg], neurosym: true }
- { id: kr,       upstream: AI/kr,       domains: [kg], neurosym: true }
- { id: rulemlrr, upstream: AI/rulemlrr, domains: [kg], neurosym: true }
- { id: ksem,     upstream: AI/ksem,     domains: [kg] }
- { id: iccbr,    upstream: AI/iccbr,    domains: [kg] }

# ------------------------------------------------------------------ Information retrieval & the Web
- { id: www,    upstream: MX/www,    domains: [ir, kg] }
- { id: sigir,  upstream: DB/sigir,  domains: [ir] }
- { id: cikm,   upstream: DB/cikm,   domains: [ir, kg] }
- { id: ecir,   upstream: DB/ecir,   domains: [ir, nlp], review_days: 78 }
- { id: wsdm,   upstream: DB/wsdm,   domains: [ir] }
- { id: sigkdd, upstream: DB/sigkdd, domains: [ml, ir] }

# ------------------------------------------------------------------ Manual venues (not in the upstream dataset)
