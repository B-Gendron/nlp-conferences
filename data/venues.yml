#       place: Somewhere, Country
#       start: 2027-05-30
#       end: 2027-06-03
#       tz: AoE
#       cycles:
#         - { label: Research track, abstract: 2026-12-01, deadline: 2026-12-08, notification: 2027-02-20 }
